name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/zenreply

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ZenReply
            org.opencontainers.image.description=Intelligent Slack auto-reply for deep work sessions
            org.opencontainers.image.vendor=zenkiet
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
            GIT_COMMIT=${{ github.sha }}

      - name: Print image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

  create-release:
    name: Create GitHub Release
    runs-on: self-hosted
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker Image

            Pull the latest image from GitHub Container Registry:

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/zenreply:${{ needs.build-and-push.outputs.version }}
            ```

            Or update your `docker-compose.yml`:

            ```yaml
            services:
              app:
                image: ghcr.io/${{ github.repository_owner }}/zenreply:${{ needs.build-and-push.outputs.version }}
            ```

            **Image digest:** `${{ needs.build-and-push.outputs.digest }}`

            ---
            *Auto-generated by ZenReply Release Workflow*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
